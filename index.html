<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>과즙세연 시그 목록</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        /* 1. 모드별 색상 정의 (기본: 라이트 모드) */
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --bg-input: #f1f5f9;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-sub: #475569;
            --table-hover: rgba(0, 0, 0, 0.01);
            --mode-btn-bg: #e2e8f0;
            --mode-btn-text: #0f172a;
            
            /* 🌸 연한 핑크 톤온톤 통일 */
            --main-pink: #ff8fa3;        
            --main-pink-hover: #ff758f;  
            --main-pink-dark: #ff4d6d;   
            --admin-hover: #ff4d6d;

            /* 🏷️ 라이트 모드 태그 및 버튼 활성화용 스타일 */
            --tag-all-bg: #ffeef1;       --tag-all-text: #ff4d6d;       
            --tag-hot-bg: #ffe4e6;       --tag-hot-text: #991b1b;       
            --tag-new-bg: #e0f2fe;       --tag-new-text: #075985;       
            --tag-star-bg: #fef9c3;      --tag-star-text: #854d0e;      
            --tag-bangsel-bg: #f3e8ff;   --tag-bangsel-text: #6b21a8;   
            --tag-roulette-bg: #dcfce7;  --tag-roulette-text: #166534;  
            --tag-etc-bg: #f1f5f9;       --tag-etc-text: #334155;       
        }

        /* 🌙 다크 모드 스타일 클래스 */
        body.dark-mode {
            --bg-body: #0b0b0e;
            --bg-card: #16161f;
            --bg-input: #16161f;
            --border-color: #272733;
            --text-main: #e2e8f0;
            --text-sub: #94a3b8;
            --table-hover: rgba(255, 255, 255, 0.02);
            --mode-btn-bg: #1e1e2f;
            --mode-btn-text: #f8fafc;
            
            /* 🌙 다크모드 연핑크 통일 */
            --main-pink: #ffb3c1;        
            --main-pink-hover: #ff8fa3;
            --main-pink-dark: #ff8fa3;
            --admin-hover: #ff4d6d;

            --tag-all-bg: rgba(255, 143, 163, 0.15); --tag-all-text: #ffb3c1; 
            --tag-hot-bg: rgba(255, 80, 80, 0.15); --tag-hot-text: #ff5555;
            --tag-new-bg: rgba(0, 255, 255, 0.15); --tag-new-text: #00f7ff;
            --tag-star-bg: rgba(255, 215, 0, 0.15); --tag-star-text: gold;
            --tag-bangsel-bg: rgba(174, 77, 255, 0.15); --tag-bangsel-text: #d680ff;
            --tag-roulette-bg: rgba(0, 229, 117, 0.15); --tag-roulette-text: #00ff84;
            --tag-etc-bg: rgba(77, 166, 255, 0.15); --tag-etc-text: #66b2ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.2s, color 0.2s;
        }

        /* 📱 반응형 고급 배너 스타일 */
        .banner-container {
            width: 100%;
            max-width: 650px;
            margin-top: 10px;
            margin-bottom: 25px;
            text-align: center;
        }
        
        .banner-img {
            width: 100%;
            display: block;
            border-radius: 22px;
            border: 2px solid #d4af37;
            height: auto;
            box-shadow:
                0 0 20px rgba(255, 215, 0, 0.15),
                0 0 40px rgba(255, 64, 159, 0.08);
        }

        /* 관리자 로그인 상태창 */
        .admin-status-bar {
            width: 100%;
            max-width: 650px;
            text-align: right;
            margin-bottom: 15px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
        }
        .admin-link-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            font-size: 12px;
            text-decoration: underline;
        }
        .admin-link-btn:hover { color: var(--admin-hover); }
        
        #changePwBtn { display: none; color: #64748b; }

        /* 소스 복사 버튼 스타일 */
        .export-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 2px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        .export-btn:hover {
            transform: scale(1.2);
        }

        /* 🌓 다크모드 토글 버튼 스타일 */
        .theme-toggle-btn {
            background-color: var(--mode-btn-bg);
            color: var(--mode-btn-text);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.2s;
        }

        /* 검색창 */
        .search-container {
            width: 100%;
            max-width: 650px;
            margin-bottom: 20px;
        }
        .search-input {
            width: 100%;
            padding: 16px 20px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-main);
            font-size: 15px;
        }
        .search-input:focus { outline: none; border-color: var(--main-pink); }

        /* 필터 버튼 영역 */
        .filter-section {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }
        .filter-group { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .filter-btn {
            background-color: var(--bg-card);
            color: var(--text-sub);
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .filter-btn:hover { transform: translateY(-2px); }

        /* 활성화 스타일 */
        .filter-btn.active[data-type="all"] { background-color: var(--tag-all-bg); color: var(--tag-all-text); border-color: var(--tag-all-text); }
        .filter-btn.active[data-type="range"] { background-color: rgba(37, 99, 235, 0.1); color: #2563eb; border-color: #2563eb; }
        .filter-btn.active[data-type="hot"] { background-color: var(--tag-hot-bg); color: var(--tag-hot-text); border-color: var(--tag-hot-text); }
        .filter-btn.active[data-type="new"] { background-color: var(--tag-new-bg); color: var(--tag-new-text); border-color: var(--tag-new-text); }
        .filter-btn.active[data-type="star"] { background-color: var(--tag-star-bg); color: var(--tag-star-text); border-color: var(--tag-star-text); }
        .filter-btn.active[data-type="bangsel"] { background-color: var(--tag-bangsel-bg); color: var(--tag-bangsel-text); border-color: var(--tag-bangsel-text); }
        .filter-btn.active[data-type="roulette"] { background-color: var(--tag-roulette-bg); color: var(--tag-roulette-text); border-color: var(--tag-roulette-text); }
        .filter-btn.active[data-type="etc"] { background-color: var(--tag-etc-bg); color: var(--tag-etc-text); border-color: var(--tag-etc-text); }

        /* 관리자 편집 패널 */
        .admin-panel {
            width: 100%;
            max-width: 650px;
            background-color: var(--bg-card);
            border: 1px solid var(--main-pink);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 30px;
            display: none;
        }
        .admin-panel h3 { margin-top: 0; color: var(--main-pink-dark); font-size: 16px; }
        .form-group { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
        .form-input {
            background-color: var(--bg-body);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            padding: 10px;
            font-size: 14px;
        }
        .btn-submit {
            background-color: var(--main-pink);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-submit:hover { background-color: var(--main-pink-hover); }

        /* 테이블 스타일 */
        .table-container {
            width: 100%;
            max-width: 650px;
            border: 1px solid var(--border-color);
            border-radius: 18px;
            overflow: hidden;
            background-color: var(--bg-card);
        }
        table { width: 100%; border-collapse: collapse; text-align: left; table-layout: fixed; }
        th, td { padding: 18px; }
        th { background-color: var(--bg-body); color: var(--text-sub); font-size: 14px; border-bottom: 1px solid var(--border-color); }
        td { border-top: 1px solid var(--border-color); font-size: 15px; vertical-align: middle; }
        tr:hover { background: var(--table-hover); }

        tr.row-hidden { opacity: 0.4; background-color: rgba(0, 0, 0, 0.3); }

        /* 표 내부 개수 숫자 */
        .num-col { 
            width: 85px; 
            color: var(--main-pink-dark); 
            font-weight: bold; 
            font-size: 16px; 
        }
        
        .title-col { 
            color: var(--text-main); 
            font-weight: 500; 
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            width: 100%;
        }
        .title-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 1;
        }
        .badge-container {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .action-col { width: 340px; text-align: right; display: none; }

        /* 인라인 에디터 인풋 스타일 */
        .inline-edit-input {
            background-color: var(--bg-body);
            border: 1px solid var(--main-pink);
            border-radius: 6px;
            color: var(--text-main);
            padding: 6px 10px;
            font-size: 14px;
            width: 100%;
        }

        /* 한 줄 즉시 분류 편집기 스타일 */
        .inline-tag-editor {
            display: inline-flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-end;
            justify-content: center;
        }
        .tag-row {
            display: flex;
            gap: 4px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        
        .btn-inline-tag {
            background-color: var(--bg-body);
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-inline-tag:hover { border-color: var(--main-pink); color: var(--main-pink-dark); }
        
        .btn-inline-tag.active-none { background-color: #334155; color: white; border-color: #475569; }
        .btn-inline-tag.active-hot { background-color: var(--tag-hot-bg); color: var(--tag-hot-text); border-color: var(--tag-hot-text); }
        .btn-inline-tag.active-new { background-color: var(--tag-new-bg); color: var(--tag-new-text); border-color: var(--tag-new-text); }
        .btn-inline-tag.active-star { background-color: var(--tag-star-bg); color: var(--tag-star-text); border-color: var(--tag-star-text); }
        .btn-inline-tag.active-bangsel { background-color: var(--tag-bangsel-bg); color: var(--tag-bangsel-text); border-color: var(--tag-bangsel-text); }
        .btn-inline-tag.active-roulette { background-color: var(--tag-roulette-bg); color: var(--tag-roulette-text); border-color: var(--tag-roulette-text); }
        .btn-inline-tag.active-etc { background-color: var(--tag-etc-bg); color: var(--tag-etc-text); border-color: var(--tag-etc-text); }

        .btn-inline-util {
            background-color: var(--bg-body);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-inline-util:hover { background-color: var(--main-pink); color: white; }

        .btn-inline-hide { background-color: rgba(234, 179, 8, 0.1); border-color: rgba(234, 179, 8, 0.3); color: #eab308; }
        .btn-inline-hide:hover { background-color: #eab308; color: black; }
        .btn-inline-hide.active-hidden { background-color: #eab308; color: black; border-color: #eab308; }

        .btn-inline-del { background-color: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.3); color: #ef4444; }
        .btn-inline-del:hover { background-color: #ef4444; color: white; }

        /* 가변형 태그 배지 스타일 */
        .badge { display: inline-block; padding: 4px 9px; border-radius: 6px; font-size: 11px; font-weight: bold; vertical-align: middle; border: 1px solid transparent; }
        .badge-hot { background-color: var(--tag-hot-bg); color: var(--tag-hot-text); border-color: rgba(153, 27, 27, 0.15); }
        .badge-new { background-color: var(--tag-new-bg); color: var(--tag-new-text); border-color: rgba(7, 89, 133, 0.15); }
        .badge-star { background-color: var(--tag-star-bg); color: var(--tag-star-text); border-color: rgba(133, 77, 14, 0.15); }
        .badge-bangsel { background-color: var(--tag-bangsel-bg); color: var(--tag-bangsel-text); border-color: rgba(107, 33, 168, 0.15); }
        .badge-roulette { background-color: var(--tag-roulette-bg); color: var(--tag-roulette-text); border-color: rgba(22, 101, 52, 0.15); }
        .badge-etc { background-color: var(--tag-etc-bg); color: var(--tag-etc-text); border-color: rgba(51, 65, 85, 0.15); }
        .badge-hidden { background-color: #eab308; color: black; }

        /* 📱 모바일 반응형 스타일 */
        @media (max-width: 600px) {
            .filter-section { gap: 8px; margin-bottom: 20px; }
            .filter-group { gap: 6px; }
            .filter-btn { padding: 7px 12px; font-size: 15px; border-radius: 12px; }
            th, td { padding: 12px 8px; }
            th { font-size: 14px; }
            .num-col { width: 60px; font-size: 16px; }
            .title-col { justify-content: space-between; align-items: center; gap: 6px; }
            .title-text { white-space: normal; word-break: keep-all; font-size: 16px; line-height: 1.4; }
            .badge-container { flex-direction: column; align-items: flex-end; gap: 4px; }
            .badge { padding: 3px 6px; font-size: 12px; border-radius: 5px; }
        }
    </style>

        localStorage.removeItem('seyeonSigData');
    </script>

    <div class="search-container">

    <div class="filter-section">

            <button class="filter-btn" data-type="hot" onclick="filterData('tag', 'hot', this)">HOT 🔥</button>
            <button class="filter-btn" data-type="new" onclick="filterData('tag', 'new', this)">NEW ✨</button>
            <button class="filter-btn" data-type="star" onclick="filterData('tag', 'star', this)">열혈 ⭐</button>
            <button class="filter-btn" data-type="bangsel" onclick="filterData('tag', 'bangsel', this)">방셀 📸</button>
            <button class="filter-btn" data-type="roulette" onclick="filterData('tag', 'roulette', this)">룰렛 🎰</button>
            <button class="filter-btn" data-type="etc" onclick="filterData('tag', 'etc', this)">기타 🎸</button>
        </div>
        <div class="filter-group">
            <button class="filter-btn" data-type="range" onclick="filterData('range', [100, 199], this)">100~199</button>
            <button class="filter-btn" data-type="range" onclick="filterData('range', [200, 299], this)">200~299</button>

        let sigData = JSON.parse(localStorage.getItem('seyeonSigData')) || defaultData;

        function initTheme() {
            const savedTheme = localStorage.getItem('seyeonTheme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
                document.getElementById('themeToggleBtn').innerText = "☀️ 라이트 모드";
            } else {
                document.body.classList.remove('dark-mode');
                document.getElementById('themeToggleBtn').innerText = "🌙 다크 모드";
            }
        }

        function toggleTheme() {
            if (document.body.classList.contains('dark-mode')) {
                document.body.classList.remove('dark-mode');
                localStorage.setItem('seyeonTheme', 'light');
                document.getElementById('themeToggleBtn').innerText = "🌙 다크 모드";
            } else {
                document.body.classList.add('dark-mode');
                localStorage.setItem('seyeonTheme', 'dark');
                document.getElementById('themeToggleBtn').innerText = "☀️ 라이트 모드";
            }
        }

        initTheme();

        function getSavedPasswordHash() {
            return localStorage.getItem('adminPwHash') || DEFAULT_HASHED_PW;
        }

        function toggleAdminMode() {
            if (!isAdmin) {
                const password = prompt("관리자 비밀번호를 입력하세요:");
                if (!password) return;
                
                const hashedPassword = CryptoJS.SHA256(password).toString();
                if (hashedPassword === getSavedPasswordHash()) {
                    isAdmin = true;
                    document.getElementById('adminLoginBtn').innerText = "🔓 관리자 모드 로그아웃";
                    document.getElementById('adminPanel').style.display = "block";
                    document.getElementById('thAction').style.display = "table-cell";
                    document.getElementById('changePwBtn').style.display = "inline-block";
                    renderTable();
                    alert("관리자 로그인 성공!");
                } else {
                    alert("비밀번호가 틀렸습니다.");
                }
            } else {
                isAdmin = false;
                editingIndex = null;
                document.getElementById('adminLoginBtn').innerText = "🔒 관리자 모드 로그인";
                document.getElementById('adminPanel').style.display = "none";
                document.getElementById('thAction').style.display = "none";
                document.getElementById('changePwBtn').style.display = "none";
                renderTable();
                alert("로그아웃 되었습니다.");
            }
        }

        function changeAdminPassword() {
            if (!isAdmin) return;
            const currentPw = prompt("현재 비밀번호를 입력하세요:");
            if (!currentPw) return;
            
            const currentHash = CryptoJS.SHA256(currentPw).toString();
            if (currentHash !== getSavedPasswordHash()) {
                alert("현재 비밀번호가 일치하지 않습니다.");
                return;
            }
            
            const newPw = prompt("새로운 비밀번호를 입력하세요:");
            if (!newPw) return;
            const newPwConfirm = prompt("새로운 비밀번호를 한 번 더 입력하세요:");
            
            if (newPw !== newPwConfirm) {
                alert("새 비밀번호가 일치하지 않습니다.");
                return;
            }
            
            const newHash = CryptoJS.SHA256(newPw).toString();
            localStorage.setItem('adminPwHash', newHash);
            alert("비밀번호가 성공적으로 변경되었습니다.");
        }

        function renderTable() {
            const tableBody = document.getElementById('sigTableBody');
            tableBody.innerHTML = '';

            const searchKeyword = document.getElementById('searchInput').value.trim().toLowerCase();

            let displayData = [...sigData].sort((a, b) => {
                if (a.num !== b.num) return a.num - b.num;
                return a.title.localeCompare(b.title, 'ko');
            });

            displayData.forEach((item, index) => {
                const originalIndex = sigData.findIndex(o => o.num === item.num && o.title === item.title);

                if (filterType === 'tag') {
                    if (!item.tags || !item.tags.includes(filterValue)) return;
                } else if (filterType === 'range') {
                    if (item.num < filterValue[0] || item.num > filterValue[1]) return;
                }

                if (searchKeyword) {
                    const numMatch = item.num.toString().includes(searchKeyword);
                    const titleMatch = item.title.toLowerCase().includes(searchKeyword);
                    if (!numMatch && !titleMatch) return;
                }

                const isHidden = item.tags && item.tags.includes('hidden');
                if (isHidden && !isAdmin) return;

                const tr = document.createElement('tr');
                if (isHidden) tr.classList.add('row-hidden');

                const tdNum = document.createElement('td');
                tdNum.className = 'num-col';
                tdNum.innerText = item.num;
                tr.appendChild(tdNum);

                const tdTitle = document.createElement('td');
                const titleWrapper = document.createElement('div');
                titleWrapper.className = 'title-col';

                if (isAdmin && editingIndex === originalIndex) {
                    const inputNum = document.createElement('input');
                    inputNum.type = 'number';
                    inputNum.className = 'inline-edit-input';
                    inputNum.style.width = '70px';
                    inputNum.value = item.num;
                    inputNum.onclick = (e) => e.stopPropagation();

                    const inputTitle = document.createElement('input');
                    inputTitle.type = 'text';
                    inputTitle.className = 'inline-edit-input';
                    inputTitle.style.flexGrow = '1';
                    inputTitle.value = item.title;
                    inputTitle.onclick = (e) => e.stopPropagation();
                    
                    inputTitle.onkeydown = (e) => {
                        if (e.key === 'Enter') saveInlineEdit(originalIndex, inputNum.value, inputTitle.value);
                    };

                    titleWrapper.appendChild(inputNum);
                    titleWrapper.appendChild(inputTitle);
                } else {
                    const textSpan = document.createElement('span');
                    textSpan.className = 'title-text';
                    textSpan.innerText = item.title;
                    titleWrapper.appendChild(textSpan);

                    const badgeContainer = document.createElement('div');
                    badgeContainer.className = 'badge-container';

                    if (item.tags) {
                        if (item.tags.includes('hidden')) {
                            const badge = document.createElement('span');
                            badge.className = 'badge badge-hidden';
                            badge.innerText = '숨김';
                            badgeContainer.appendChild(badge);
                        }
                        if (item.tags.includes('hot')) {
                            const badge = document.createElement('span');
                            badge.className = 'badge badge-hot';
                            badge.innerText = 'HOT 🔥';
                            badgeContainer.appendChild(badge);
                        }
                        if (item.tags.includes('new')) {
                            const badge = document.createElement('span');
                            badge.className = 'badge badge-new';
                            badge.innerText = 'NEW ✨';
                            badgeContainer.appendChild(badge);
                        }
                        if (item.tags.includes('star')) {
                            const badge = document.createElement('span');
                            badge.className = 'badge badge-star';
                            badge.innerText = '열혈 ⭐';
                            badgeContainer.appendChild(badge);
                        }
                        if (item.tags.includes('bangsel')) {
                            const badge = document.createElement('span');
                            badge.className = 'badge badge-bangsel';
                            badge.innerText = '방셀 📸';
                            badgeContainer.appendChild(badge);
                        }
                        if (item.tags.includes('roulette')) {
                            const badge = document.createElement('span');
                            badge.className = 'badge badge-roulette';
                            badge.innerText = '룰렛 🎰';
                            badgeContainer.appendChild(badge);
                        }
                        if (item.tags.includes('etc')) {
                            const badge = document.createElement('span');
                            badge.className = 'badge badge-etc';
                            badge.innerText = '기타 🎸';
                            badgeContainer.appendChild(badge);
                        }
                    }
                    titleWrapper.appendChild(badgeContainer);
                }

                tdTitle.appendChild(titleWrapper);
                tr.appendChild(tdTitle);

                if (isAdmin) {
                    const tdAction = document.createElement('td');
                    tdAction.className = 'action-col';
                    tdAction.style.display = 'table-cell';

                    const editorDiv = document.createElement('div');
                    editorDiv.className = 'inline-tag-editor';

                    const tagRow = document.createElement('div');
                    tagRow.className = 'tag-row';

                    const tagTypes = [
                        { key: 'hot', label: 'HOT' },
                        { key: 'new', label: 'NEW' },
                        { key: 'star', label: '열혈' },
                        { key: 'bangsel', label: '방셀' },
                        { key: 'roulette', label: '룰렛' },
                        { key: 'etc', label: '기타' }
                    ];

                    tagTypes.forEach(t => {
                        const btn = document.createElement('button');
                        btn.className = 'btn-inline-tag';
                        const hasTag = item.tags && item.tags.includes(t.key);
                        if (hasTag) btn.classList.add('active-' + t.key);
                        btn.innerText = t.label;
                        btn.onclick = () => toggleInlineTag(originalIndex, t.key);
                        tagRow.appendChild(btn);
                    });
                    editorDiv.appendChild(tagRow);

                    const utilRow = document.createElement('div');
                    utilRow.className = 'tag-row';

                    const editBtn = document.createElement('button');
                    editBtn.className = 'btn-inline-util';
                    if (editingIndex === originalIndex) {
                        editBtn.innerText = '💾 저장';
                        editBtn.style.backgroundColor = '#22c55e';
                        editBtn.style.color = 'white';
                        editBtn.onclick = () => {
                            const inputs = titleWrapper.querySelectorAll('.inline-edit-input');
                            saveInlineEdit(originalIndex, inputs[0].value, inputs[1].value);
                        };
                    } else {
                        editBtn.innerText = '✏️ 수정';
                        editBtn.onclick = () => { editingIndex = originalIndex; renderTable(); };
                    }
                    utilRow.appendChild(editBtn);

                    const hideBtn = document.createElement('button');
                    hideBtn.className = 'btn-inline-util btn-inline-hide';
                    if (isHidden) hideBtn.classList.add('active-hidden');
                    hideBtn.innerText = isHidden ? '👁️ 보이기' : '🚫 숨기기';
                    hideBtn.onclick = () => toggleInlineTag(originalIndex, 'hidden');
                    utilRow.appendChild(hideBtn);

                    const delBtn = document.createElement('button');
                    delBtn.className = 'btn-inline-util btn-inline-del';
                    delBtn.innerText = '🗑️ 삭제';
                    delBtn.onclick = () => deleteSigItem(originalIndex);
                    utilRow.appendChild(delBtn);

                    editorDiv.appendChild(utilRow);
                    tdAction.appendChild(editorDiv);
                    tr.appendChild(tdAction);
                }

                tableBody.appendChild(tr);
            });
        }

        function filterData(type, value, btnElement) {
            filterType = type;
            filterValue = value;

            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            renderTable();
        }

        document.getElementById('searchInput').addEventListener('input', renderTable);

        function addSigItem() {
            const numInput = document.getElementById('formNum');
            const titleInput = document.getElementById('formTitle');
            const tagSelect = document.getElementById('formTag');

            const num = parseInt(numInput.value);
            const title = titleInput.value.trim();
            const selectedTag = tagSelect.value;

            if (!num || !title) {
                alert("개수와 내용을 정확히 입력하세요.");
                return;
            }

            const newTags = selectedTag ? [selectedTag] : [];
            sigData.push({ num, title, tags: newTags });
            
            numInput.value = '';
            titleInput.value = '';
            tagSelect.value = '';

            renderTable();
            alert("새 항목이 하단 리스트에 추가 정렬되었습니다!");
        }

        function toggleInlineTag(index, tag) {
            if (!sigData[index].tags) sigData[index].tags = [];
            const tagIdx = sigData[index].tags.indexOf(tag);
            if (tagIdx > -1) {
                sigData[index].tags.splice(tagIdx, 1);
            } else {
                sigData[index].tags.push(tag);
            }
            renderTable();
        }

        function saveInlineEdit(index, newNum, newTitle) {
            const parsedNum = parseInt(newNum);
            const parsedTitle = newTitle.trim();

            if (!parsedNum || !parsedTitle) {
                alert("개수와 내용을 올바르게 입력해 주세요.");
                return;
            }

            sigData[index].num = parsedNum;
            sigData[index].title = parsedTitle;
            editingIndex = null;
            renderTable();
        }

        function deleteSigItem(index) {
            if (confirm("정말 이 항목을 삭제하시겠습니까?")) {
                sigData.splice(index, 1);
                editingIndex = null;
                renderTable();
            }
        }

        function exportUpdatedHtmlSource() {
            // [독립 처리 완료] 관리자가 아닐 때 📋를 누르면 일회성 비밀번호 인증만 거치고, 관리자 상태(isAdmin)를 변경하지 않습니다.
            if (!isAdmin) {
                const password = prompt("소스코드를 내보내려면 패스워드를 입력하세요:");
                if (!password) return;
                
                const hashedPassword = CryptoJS.SHA256(password).toString();
                if (hashedPassword !== getSavedPasswordHash()) {
                    alert("비밀번호가 일치하지 않아 소스코드를 추출할 수 없습니다.");
                    return;
                }
            }

            let sortedFinalData = [...sigData].sort((a, b) => {
                if (a.num !== b.num) return a.num - b.num;
                return a.title.localeCompare(b.title, 'ko');
            });

            const currentHashedPw = getSavedPasswordHash();
            const dataString = JSON.stringify(sortedFinalData, null, 12);
            const currentScript = document.documentElement.outerHTML;

            const dataRegex = /(const defaultData\s*=\s*\[)([\s\S]*?)(\];)/;
            let updatedScript = currentScript.replace(dataRegex, `$1\n${dataString.substring(1, dataString.length - 1)}$3`);

            const pwRegex = /(const DEFAULT_HASHED_PW\s*=\s*")([a-f0-9]{64})(";)/;
            updatedScript = updatedScript.replace(pwRegex, `$1${currentHashedPw}$3`);

            const textarea = document.createElement('textarea');
            textarea.value = "<!DOCTYPE html>\n" + updatedScript;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);

            alert("🎉 변경사항 및 패스워드가 보존된 최종 배포용 HTML 소스코드가 클립보드에 복사되었습니다! 화면 변화 없이 백그라운드 복사가 완료되었으니 소스에 덮어쓰기 하세요.");
        }

        renderTable();
