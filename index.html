<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>과즙세연 시그 목록</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        /* 1. 모드별 색상 정의 (기본: 라이트 모드) */
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --bg-input: #f1f5f9;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-sub: #475569;
            --table-hover: rgba(0, 0, 0, 0.01);
            --mode-btn-bg: #e2e8f0;
            --mode-btn-text: #0f172a;
            
            /* 🌸 연한 핑크 톤온톤 통일 */
            --main-pink: #ff8fa3;        
            --main-pink-hover: #ff758f;  
            --main-pink-dark: #ff4d6d;   
            --admin-hover: #ff4d6d;

            /* 🏷️ 라이트 모드 태그 및 버튼 활성화용 스타일 */
            --tag-all-bg: #ffeef1;       --tag-all-text: #ff4d6d;       /* [변경] 전체 버튼 활성화용 핑크 반전 컬러 */
            --tag-hot-bg: #ffe4e6;       --tag-hot-text: #991b1b;       
            --tag-new-bg: #e0f2fe;       --tag-new-text: #075985;       
            --tag-star-bg: #fef9c3;      --tag-star-text: #854d0e;      
            --tag-bangsel-bg: #f3e8ff;   --tag-bangsel-text: #6b21a8;   
            --tag-roulette-bg: #dcfce7;  --tag-roulette-text: #166534;  
            --tag-etc-bg: #f1f5f9;       --tag-etc-text: #334155;       
        }

        /* 🌙 다크 모드 스타일 클래스 */
        body.dark-mode {
            --bg-body: #0b0b0e;
            --bg-card: #16161f;
            --bg-input: #16161f;
            --border-color: #272733;
            --text-main: #e2e8f0;
            --text-sub: #94a3b8;
            --table-hover: rgba(255, 255, 255, 0.02);
            --mode-btn-bg: #1e1e2f;
            --mode-btn-text: #f8fafc;
            
            /* 🌙 다크모드 연핑크 통일 */
            --main-pink: #ffb3c1;        
            --main-pink-hover: #ff8fa3;
            --main-pink-dark: #ff8fa3;
            --admin-hover: #ff4d6d;

            --tag-all-bg: rgba(255, 143, 163, 0.15); --tag-all-text: #ffb3c1; /* [변경] 다크모드용 전체 버튼 반전 컬러 */
            --tag-hot-bg: rgba(255, 80, 80, 0.15); --tag-hot-text: #ff5555;
            --tag-new-bg: rgba(0, 255, 255, 0.15); --tag-new-text: #00f7ff;
            --tag-star-bg: rgba(255, 215, 0, 0.15); --tag-star-text: gold;
            --tag-bangsel-bg: rgba(174, 77, 255, 0.15); --tag-bangsel-text: #d680ff;
            --tag-roulette-bg: rgba(0, 229, 117, 0.15); --tag-roulette-text: #00ff84;
            --tag-etc-bg: rgba(77, 166, 255, 0.15); --tag-etc-text: #66b2ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.2s, color 0.2s;
        }

        /* 📱 반응형 고급 배너 스타일 */
        .banner-container {
            width: 100%;
            max-width: 650px;
            margin-top: 10px;
            margin-bottom: 25px;
            text-align: center;
        }
        
        .banner-img {
            width: 100%;
            display: block;
            border-radius: 22px;
            border: 2px solid #d4af37;
            height: auto;
            box-shadow:
                0 0 20px rgba(255, 215, 0, 0.15),
                0 0 40px rgba(255, 64, 159, 0.08);
        }

        /* 관리자 로그인 상태창 */
        .admin-status-bar {
            width: 100%;
            max-width: 650px;
            text-align: right;
            margin-bottom: 15px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
        }
        .admin-link-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            font-size: 12px;
            text-decoration: underline;
        }
        .admin-link-btn:hover { color: var(--admin-hover); }
        
        #changePwBtn { display: none; color: #64748b; }

        /* 소스 복사 버튼 스타일 */
        .export-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 2px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        .export-btn:hover {
            transform: scale(1.2);
        }

        /* 🌓 다크모드 토글 버튼 스타일 */
        .theme-toggle-btn {
            background-color: var(--mode-btn-bg);
            color: var(--mode-btn-text);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.2s;
        }

        /* 검색창 */
        .search-container {
            width: 100%;
            max-width: 650px;
            margin-bottom: 20px;
        }
        .search-input {
            width: 100%;
            padding: 16px 20px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-main);
            font-size: 15px;
        }
        .search-input:focus { outline: none; border-color: var(--main-pink); }

        /* 필터 버튼 영역 */
        .filter-section {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }
        .filter-group { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .filter-btn {
            background-color: var(--bg-card);
            color: var(--text-sub);
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .filter-btn:hover { transform: translateY(-2px); }

        /* [수정] 활성화 스타일 - 다른 버튼들과 똑같이 외곽선/글자색 반전 스타일로 통일 */
        .filter-btn.active[data-type="all"] { 
            background-color: var(--tag-all-bg); 
            color: var(--tag-all-text); 
            border-color: var(--tag-all-text); 
        }
        .filter-btn.active[data-type="range"] { background-color: rgba(37, 99, 235, 0.1); color: #2563eb; border-color: #2563eb; }
        
        /* 활성화된 태그 필터 버튼 */
        .filter-btn.active[data-type="hot"] { background-color: var(--tag-hot-bg); color: var(--tag-hot-text); border-color: var(--tag-hot-text); }
        .filter-btn.active[data-type="new"] { background-color: var(--tag-new-bg); color: var(--tag-new-text); border-color: var(--tag-new-text); }
        .filter-btn.active[data-type="star"] { background-color: var(--tag-star-bg); color: var(--tag-star-text); border-color: var(--tag-star-text); }
        .filter-btn.active[data-type="bangsel"] { background-color: var(--tag-bangsel-bg); color: var(--tag-bangsel-text); border-color: var(--tag-bangsel-text); }
        .filter-btn.active[data-type="roulette"] { background-color: var(--tag-roulette-bg); color: var(--tag-roulette-text); border-color: var(--tag-roulette-text); }
        .filter-btn.active[data-type="etc"] { background-color: var(--tag-etc-bg); color: var(--tag-etc-text); border-color: var(--tag-etc-text); }

        /* 관리자 편집 패널 */
        .admin-panel {
            width: 100%;
            max-width: 650px;
            background-color: var(--bg-card);
            border: 1px solid var(--main-pink);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 30px;
            display: none;
        }
        .admin-panel h3 { margin-top: 0; color: var(--main-pink-dark); font-size: 16px; }
        .form-group { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
        .form-input {
            background-color: var(--bg-body);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            padding: 10px;
            font-size: 14px;
        }
        .btn-submit {
            background-color: var(--main-pink);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-submit:hover { background-color: var(--main-pink-hover); }

        /* 테이블 스타일 */
        .table-container {
            width: 100%;
            max-width: 650px;
            border: 1px solid var(--border-color);
            border-radius: 18px;
            overflow: hidden;
            background-color: var(--bg-card);
        }
        table { width: 100%; border-collapse: collapse; text-align: left; table-layout: fixed; }
        th, td { padding: 18px; }
        th { background-color: var(--bg-body); color: var(--text-sub); font-size: 14px; border-bottom: 1px solid var(--border-color); }
        td { border-top: 1px solid var(--border-color); font-size: 15px; vertical-align: middle; }
        tr:hover { background: var(--table-hover); }

        tr.row-hidden { opacity: 0.4; background-color: rgba(0, 0, 0, 0.3); }

        /* 표 내부 개수 숫자 */
        .num-col { 
            width: 85px; 
            color: var(--main-pink-dark); 
            font-weight: bold; 
            font-size: 16px; 
        }
        
        .title-col { 
            color: var(--text-main); 
            font-weight: 500; 
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            width: 100%;
        }
        .title-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 1;
        }
        .badge-container {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .action-col { width: 340px; text-align: right; display: none; }

        /* 인라인 에디터 인풋 스타일 */
        .inline-edit-input {
            background-color: var(--bg-body);
            border: 1px solid var(--main-pink);
            border-radius: 6px;
            color: var(--text-main);
            padding: 6px 10px;
            font-size: 14px;
            width: 100%;
        }

        /* 한 줄 즉시 분류 편집기 스타일 */
        .inline-tag-editor {
            display: inline-flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-end;
            justify-content: center;
        }
        .tag-row {
            display: flex;
            gap: 4px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        
        .btn-inline-tag {
            background-color: var(--bg-body);
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-inline-tag:hover { border-color: var(--main-pink); color: var(--main-pink-dark); }
        
        .btn-inline-tag.active-none { background-color: #334155; color: white; border-color: #475569; }
        .btn-inline-tag.active-hot { background-color: var(--tag-hot-bg); color: var(--tag-hot-text); border-color: var(--tag-hot-text); }
        .btn-inline-tag.active-new { background-color: var(--tag-new-bg); color: var(--tag-new-text); border-color: var(--tag-new-text); }
        .btn-inline-tag.active-star { background-color: var(--tag-star-bg); color: var(--tag-star-text); border-color: var(--tag-star-text); }
        .btn-inline-tag.active-bangsel { background-color: var(--tag-bangsel-bg); color: var(--tag-bangsel-text); border-color: var(--tag-bangsel-text); }
        .btn-inline-tag.active-roulette { background-color: var(--tag-roulette-bg); color: var(--tag-roulette-text); border-color: var(--tag-roulette-text); }
        .btn-inline-tag.active-etc { background-color: var(--tag-etc-bg); color: var(--tag-etc-text); border-color: var(--tag-etc-text); }

        .btn-inline-util {
            background-color: var(--bg-body);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-inline-util:hover { background-color: var(--main-pink); color: white; }

        .btn-inline-hide { background-color: rgba(234, 179, 8, 0.1); border-color: rgba(234, 179, 8, 0.3); color: #eab308; }
        .btn-inline-hide:hover { background-color: #eab308; color: black; }
        .btn-inline-hide.active-hidden { background-color: #eab308; color: black; border-color: #eab308; }

        .btn-inline-del { background-color: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.3); color: #ef4444; }
        .btn-inline-del:hover { background-color: #ef4444; color: white; }

        /* 가변형 태그 배지 스타일 */
        .badge { display: inline-block; padding: 4px 9px; border-radius: 6px; font-size: 11px; font-weight: bold; vertical-align: middle; border: 1px solid transparent; }
        .badge-hot { background-color: var(--tag-hot-bg); color: var(--tag-hot-text); border-color: rgba(153, 27, 27, 0.15); }
        .badge-new { background-color: var(--tag-new-bg); color: var(--tag-new-text); border-color: rgba(7, 89, 133, 0.15); }
        .badge-star { background-color: var(--tag-star-bg); color: var(--tag-star-text); border-color: rgba(133, 77, 14, 0.15); }
        .badge-bangsel { background-color: var(--tag-bangsel-bg); color: var(--tag-bangsel-text); border-color: rgba(107, 33, 168, 0.15); }
        .badge-roulette { background-color: var(--tag-roulette-bg); color: var(--tag-roulette-text); border-color: rgba(22, 101, 52, 0.15); }
        .badge-etc { background-color: var(--tag-etc-bg); color: var(--tag-etc-text); border-color: rgba(51, 65, 85, 0.15); }
        .badge-hidden { background-color: #eab308; color: black; }

        /* 📱 모바일 반응형 */
        @media (max-width: 600px) {
            /* 🔽 필터 버튼 모바일 가독성 최적화 수정본 */
            .filter-section {
                gap: 8px;
                margin-bottom: 20px;
            }
            .filter-group {
                gap: 4px; /* 버튼 사이 좌우 여백을 줄여 최대한 한 줄에 많이 배치 */
            }
            .filter-btn {
                padding: 6px 11px;  /* 안쪽 좌우 여백을 조정하여 글씨 크기 대비 알맞은 비율 유지 */
                ont-size: 13px;     /* ⭐ 원래 원하셨던 시원한 글씨 크기 유지! */
                border-radius: 12px; /* 깔끔한 사각형 형태 유지 */
            }
            /* 🔼 필터 버튼 모바일 최적화 끝 */

            th, td { padding: 12px 8px; }
            .num-col { width: 50px; font-size: 14px; }
            .title-col { justify-content: space-between; align-items: center; gap: 6px; }
            .title-text { white-space: normal; word-break: keep-all; font-size: 14px; line-height: 1.3; }
            .badge-container { flex-direction: column; align-items: flex-end; gap: 3px; }
            .badge { padding: 2px 5px; font-size: 10px; border-radius: 4px; }
        }
    </style>
    <script>
        localStorage.removeItem('seyeonSigData');
    </script>
</head>
<body>

    <div class="admin-status-bar">
        <button id="themeToggleBtn" class="theme-toggle-btn" onclick="toggleTheme()">🌙 다크 모드</button>
        <button id="exportCodeBtn" class="export-btn" onclick="exportUpdatedHtmlSource()" title="최종 소스코드 클립보드 복사">📋</button>
        <button id="changePwBtn" class="admin-link-btn" onclick="changeAdminPassword()" style="display: none;">🔑 비밀번호 변경</button>
        <button id="adminLoginBtn" class="admin-link-btn" onclick="toggleAdminMode()">🔒 관리자 모드 로그인</button>
    </div>

    <div class="banner-container">
        <img src="https://stimg.sooplive.com/NORMAL_BBS/0/14909290/80466a1839bf0c26b.png" alt="과즙세연 시그 목록" class="banner-img">
    </div>

    <div id="adminPanel" class="admin-panel">
        <h3>✨ 시그 및 항목 신규 추가</h3>
        <div class="form-group">
            <input type="number" id="formNum" class="form-input" style="width: 100px;" placeholder="개수">
            <input type="text" id="formTitle" class="form-input" style="flex-grow: 1;" placeholder="내용 및 제목을 입력하세요">
            <select id="formTag" class="form-input">
                <option value="">일반 분류</option>
                <option value="hot">HOT 🔥</option>
                <option value="new">NEW ✨</option>
                <option value="star">열혈 ⭐</option>
                <option value="bangsel">방셀 📸</option>
                <option value="roulette">룰렛 🎰</option>
                <option value="etc">기타 🎸</option>
            </select>
            <button class="btn-submit" onclick="addSigItem()">확인/추가</button>
        </div>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="개수 또는 제목 검색">
    </div>

    <div class="filter-section">
        <div class="filter-group" style="margin-bottom: 5px;">
            <button class="filter-btn active" data-type="all" onclick="filterData('all', null, this)">전체</button>
            <button class="filter-btn" data-type="hot" onclick="filterData('tag', 'hot', this)">HOT 🔥</button>
            <button class="filter-btn" data-type="new" onclick="filterData('tag', 'new', this)">NEW ✨</button>
            <button class="filter-btn" data-type="star" onclick="filterData('tag', 'star', this)">열혈 ⭐</button>
            <button class="filter-btn" data-type="bangsel" onclick="filterData('tag', 'bangsel', this)">방셀 📸</button>
            <button class="filter-btn" data-type="roulette" onclick="filterData('tag', 'roulette', this)">룰렛 🎰</button>
            <button class="filter-btn" data-type="etc" onclick="filterData('tag', 'etc', this)">기타 🎸</button>
        </div>
        <div class="filter-group">
            <button class="filter-btn" data-type="range" onclick="filterData('range', [100, 199], this)">100~199</button>
            <button class="filter-btn" data-type="range" onclick="filterData('range', [200, 299], this)">200~299</button>
            <button class="filter-btn" data-type="range" onclick="filterData('range', [300, 399], this)">300~399</button>
            <button class="filter-btn" data-type="range" onclick="filterData('range', [400, 499], this)">400~499</button>
            <button class="filter-btn" data-type="range" onclick="filterData('range', [500, 999], this)">500~999</button>
            <button class="filter-btn" data-type="range" onclick="filterData('range', [1000, 999999], this)">1000~</button>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th class="num-col">개수</th>
                    <th>내용</th>
                    <th class="action-col" id="thAction" style="display: none;">원클릭 항목 관리</th>
                </tr>
            </thead>
            <tbody id="sigTableBody">
               </tbody>
        </table>
    </div>

    <script>
        const DEFAULT_HASHED_PW = "aea27ad297988629c3fb643b30a78a87de4cc16ec970e55d6d57924fabd42a93";
        let isAdmin = false;
        let editingIndex = null; 

        const defaultData = [
            { num: 66, title: "BGM 신청곡 (가수,제목 적어서)", tags: ["etc"] },
            { num: 99, title: "일반 룰렛", tags: ["roulette"] },
            { num: 130, title: "먹먹마", tags: ["roulette","new","etc"] },
            { num: 140, title: "먹어+1", tags: ["new","etc"] },
            { num: 150, title: "먹지마-1", tags: ["new","etc"] },
            { num: 188, title: "Overdrive", tags: [] },
            { num: 200, title: "외모체크", tags: ["hot"] },
            { num: 202, title: "너뿐이야", tags: ["hot"] },
            { num: 222, title: "포켓몬댄스", tags: [] },
            { num: 224, title: "힙사사돈", tags: [] },
            { num: 227, title: "삐삐송", tags: [] },
            { num: 234, title: "FLI:P", tags: [] },
            { num: 244, title: "삐끼삐끼", tags: [] },
            { num: 245, title: "미야오", tags: [] },
            { num: 252, title: "언터쳐블", tags: [] },
            { num: 257, title: "모찌송", tags: ["hot","new"] },

        function initTheme() {
            const savedTheme = localStorage.getItem('seyeonTheme');
            if (savedTheme === 'dark') {

        function getSavedPasswordHash() {
            return localStorage.getItem('seyeonAdminPwHash') || DEFAULT_HASHED_PW;

        function toggleAdminMode() {
            if (!isAdmin) {
                const inputPw = prompt("관리자 비밀번호를 입력하세요:");
                if (inputPw === null) return;

                const hashedInput = CryptoJS.SHA256(inputPw).toString();
                const targetHash = getSavedPasswordHash();

                if (hashedInput === targetHash) {
                    isAdmin = true;
                    document.getElementById('adminLoginBtn').innerText = "🔒 관리자 모드 로그아웃";
                    document.getElementById('changePwBtn').style.display = "inline-block";
                    document.getElementById('adminPanel').style.display = "block";
                } else {
                    alert("비밀번호가 일치하지 않습니다.");
                }
            } else {
                isAdmin = false;
                editingIndex = null;
                document.getElementById('adminLoginBtn').innerText = "🔒 관리자 모드 로그인";
                document.getElementById('changePwBtn').style.display = "none";
                document.getElementById('adminPanel').style.display = "none";
                resetForm();
            }
            applyFilters();
        }

        function changeAdminPassword() {
            if (!isAdmin) return;

            const newPw = prompt("새로운 비밀번호를 입력하세요:");
            if (newPw === null) return;
            
            const confirmPw = prompt("새로운 비밀번호를 한번 더 입력하세요:");
            if (confirmPw === null) return;

            if (newPw !== confirmPw) {
                alert("입력하신 두 비밀번호가 일치하지 않습니다. 다시 시도해 주세요.");
                return;
            }

            if (newPw.trim() === "") {
                alert("공백 비밀번호는 사용할 수 없습니다.");
                return;
            }

            const newHash = CryptoJS.SHA256(newPw).toString();
            localStorage.setItem('seyeonAdminPwHash', newHash);
            alert("🔒 관리자 비밀번호가 성공적으로 변경되었습니다!");
        }

        function renderTable(data) {
            const tableBody = document.getElementById('sigTableBody');
            tableBody.innerHTML = '';

            if (data.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="' + (isAdmin ? 3 : 2) + '" style="text-align:center; color:#64748b; padding: 50px 0;">검색 결과가 없습니다.</td></tr>';
                return;
            }

            data.forEach((item, loopIdx) => {
                const originIndex = sigData.findIndex((origin, origIdx) => origIdx === item._originalIdx);
                if (originIndex === -1) return;
                
                if (!isAdmin && item.tags && item.tags.includes('hidden')) {
                    return;
                }

                const tr = document.createElement('tr');
                const itemTags = item.tags || [];
                const isHidden = itemTags.includes('hidden');

                if (isHidden) {
                    tr.classList.add('row-hidden');
                }

                let badgeInnerHtml = '';
                if (isHidden) {
                    badgeInnerHtml += '<span class="badge badge-hidden">숨김 목록</span>';
                }
                itemTags.forEach(tag => {
                    if (tag === 'hot') badgeInnerHtml += '<span class="badge badge-hot">HOT 🔥</span>';
                    else if (tag === 'new') badgeInnerHtml += '<span class="badge badge-new">NEW ✨</span>';
                    else if (tag === 'star') badgeInnerHtml += '<span class="badge badge-star">열혈 ⭐</span>';
                    else if (tag === 'bangsel') badgeInnerHtml += '<span class="badge badge-bangsel">방셀 📸</span>';
                    else if (tag === 'roulette') badgeInnerHtml += '<span class="badge badge-roulette">룰렛 🎰</span>';
                    else if (tag === 'etc') badgeInnerHtml += '<span class="badge badge-etc">기타 🎸</span>';
                });

                let numTdContent = item.num.toLocaleString();
                
                let titleTdContent = `
                    <div class="title-col">
                        <span class="title-text">${item.title}</span>
                        ${badgeInnerHtml ? `<div class="badge-container">${badgeInnerHtml}</div>` : ''}
                    </div>
                `;
                let actionTd = '';

                if (isAdmin) {
                    if (editingIndex === originIndex) {
                        numTdContent = `<input type="number" id="inlineEditNum" class="inline-edit-input" value="${item.num}" style="width:75px;">`;
                        titleTdContent = `<input type="text" id="inlineEditTitle" class="inline-edit-input" value="${item.title}">`;
                        
                        actionTd = `
                        <td class="action-col" style="display: table-cell; vertical-align: middle;">
                            <div class="inline-tag-editor">
                                <div class="tag-row" style="margin-bottom:4px;">
                                    <button class="btn-inline-util" onclick="saveInlineEdit(${originIndex})" style="background-color:var(--main-pink); border-color:var(--main-pink); color:white;">저장</button>
                                    <button class="btn-inline-util" onclick="cancelInlineEdit()">취소</button>
                                </div>
                            </div>
                        </td>`;
                    } else {
                        actionTd = `
                        <td class="action-col" style="display: table-cell;">
                            <div class="inline-tag-editor">
                                <div class="tag-row">
                                    <button class="btn-inline-tag ${itemTags.length === 0 || (itemTags.length === 1 && isHidden) ? 'active-none' : ''}" onclick="resetTagsDirect(${originIndex})">일반</button>
                                    <button class="btn-inline-tag ${itemTags.includes('hot') ? 'active-hot' : ''}" onclick="toggleTagDirect(${originIndex}, 'hot')">HOT</button>
                                    <button class="btn-inline-tag ${itemTags.includes('new') ? 'active-new' : ''}" onclick="toggleTagDirect(${originIndex}, 'new')">NEW</button>
                                    <button class="btn-inline-tag ${itemTags.includes('star') ? 'active-star' : ''}" onclick="toggleTagDirect(${originIndex}, 'star')">열혈</button>
                                </div>
                                <div class="tag-row">
                                    <button class="btn-inline-tag ${itemTags.includes('bangsel') ? 'active-bangsel' : ''}" onclick="toggleTagDirect(${originIndex}, 'bangsel')">방셀</button>
                                    <button class="btn-inline-tag ${itemTags.includes('roulette') ? 'active-roulette' : ''}" onclick="toggleTagDirect(${originIndex}, 'roulette')">룰렛</button>
                                    <button class="btn-inline-tag ${itemTags.includes('etc') ? 'active-etc' : ''}" onclick="toggleTagDirect(${originIndex}, 'etc')">기타</button>
                                    <button class="btn-inline-util" onclick="startInlineEdit(${originIndex})">수정</button>
                                    <button class="btn-inline-util btn-inline-hide ${isHidden ? 'active-hidden' : ''}" onclick="toggleHideItem(${originIndex})">${isHidden ? '해제' : '숨김'}</button>
                                    <button class="btn-inline-util btn-inline-del" onclick="deleteSigItem(${originIndex})">삭제</button>
                                </div>
                            </div>
                        </td>`;
                    }
                }

                tr.innerHTML = `
                    <td class="num-col" style="vertical-align: middle;">${numTdContent}</td>
                    <td style="vertical-align: middle;">${titleTdContent}</td>
                    ${actionTd}
                `;
                tableBody.appendChild(tr);
            });
        }

        function toggleTagDirect(index, targetTag) {
            if (!sigData[index].tags) {
                sigData[index].tags = [];
            }
            
            const tagIdx = sigData[index].tags.indexOf(targetTag);
            if (tagIdx > -1) {
                sigData[index].tags.splice(tagIdx, 1); 
            } else {
                sigData[index].tags.push(targetTag);   
            }
            saveAndRefresh();
        }

        function resetTagsDirect(index) {
            const isHidden = sigData[index].tags ? sigData[index].tags.includes('hidden') : false;
            sigData[index].tags = isHidden ? ['hidden'] : [];
            saveAndRefresh();
        }

        function startInlineEdit(index) {
            editingIndex = index;
            applyFilters();
        }

        function cancelInlineEdit() {
            editingIndex = null;
            applyFilters();
        }

        function saveInlineEdit(index) {
            const editNum = parseInt(document.getElementById('inlineEditNum').value);
            const editTitle = document.getElementById('inlineEditTitle').value.trim();

            if (!editNum || !editTitle) {
                alert("개수와 내용을 모두 올바르게 입력해야 수정이 완료됩니다.");
                return;
            }

            sigData[index].num = editNum;
            sigData[index].title = editTitle;
            
            editingIndex = null;
            saveAndRefresh();
        }

        function toggleHideItem(index) {
            if (!sigData[index].tags) {
                sigData[index].tags = [];
            }
            
            const findIdx = sigData[index].tags.indexOf('hidden');
            if (findIdx > -1) {
                sigData[index].tags.splice(findIdx, 1); 
            } else {
                sigData[index].tags.push('hidden'); 
            }
            
            saveAndRefresh();
        }

        function addSigItem() {
            const numVal = parseInt(document.getElementById('formNum').value);
            const titleVal = document.getElementById('formTitle').value.trim();
            const tagVal = document.getElementById('formTag').value;

            if (!numVal || !titleVal) {
                alert("개수와 내용을 정확하게 입력해주세요.");
                return;
            }

            const itemData = { num: numVal, title: titleVal, tags: tagVal ? [tagVal] : [] };
            sigData.push(itemData);

            saveAndRefresh();
            resetForm();
        }

        function deleteSigItem(index) {
            if (confirm(`'${sigData[index].title}' 항목을 목록에서 삭제하시겠습니까?`)) {
                sigData.splice(index, 1);
                if (editingIndex === index) editingIndex = null;
                saveAndRefresh();
            }
        }

        function resetForm() {
            document.getElementById('formNum').value = "";
            document.getElementById('formTitle').value = "";
            document.getElementById('formTag').value = "";
        }

        function saveAndRefresh() {
            localStorage.setItem('seyeonSigData', JSON.stringify(sigData));
            applyFilters();
        }

        function filterData(type, value, buttonElement) {
            filterType = type;
            filterValue = value;
            
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');

            document.getElementById('searchInput').value = '';
            applyFilters();
        }

        function applyFilters() {
            const searchText = document.getElementById('searchInput').value.trim().toLowerCase();
            
            let filtered = sigData.map((item, idx) => ({...item, _originalIdx: idx}));

            if (filterType === 'tag') {
                filtered = filtered.filter(item => item.tags && item.tags.includes(filterValue));
            } else if (filterType === 'range') {
                filtered = filtered.filter(item => item.num >= filterValue[0] && item.num <= filterValue[1]);
            }

            if (searchText) {
                filtered = filtered.filter(item => 
                    item.num.toString().includes(searchText) || 
                    item.title.toLowerCase().includes(searchText)
                );
            }

            filtered.sort((a, b) => a.num - b.num);
            renderTable(filtered);
            
            const thAction = document.getElementById('thAction');
            if (thAction) {
                thAction.style.display = isAdmin ? "table-cell" : "none";
            }
        }

        function exportUpdatedHtmlSource() {
            const inputPw = prompt("소스코드를 추출하려면 관리자 비밀번호를 입력하세요:");
            if (inputPw === null) return;

            const hashedInput = CryptoJS.SHA256(inputPw).toString();
            const targetHash = getSavedPasswordHash();

            if (hashedInput !== targetHash) {
                alert("비밀번호가 일치하지 않습니다.");
                return;
            }

            const sortedData = [...sigData].sort((a, b) => a.num - b.num);
            const wholeDocumentString = document.documentElement.outerHTML;
            const regex = /(const\s+defaultData\s*=\s*\[)[\s\S]*?(\];)/;
            const formattedDataJson = "\n" + sortedData.map(item => `            { num: ${item.num}, title: "${item.title}", tags: ${JSON.stringify(item.tags)} }`).join(",\n") + "\n        ";
            
            let updatedSource = "<!DOCTYPE html>\n<html lang=\"ko\">\n" + wholeDocumentString + "\n</html>";
            
            updatedSource = updatedSource.replace(/<div id="adminPanel" class="admin-panel" style="display:\s*(block|none);?">/g, '<div id="adminPanel" class="admin-panel">');
            updatedSource = updatedSource.replace(/<button id="changePwBtn" class="admin-link-btn" style="display:\s*(inline-block|none);?">/g, '<button id="changePwBtn" class="admin-link-btn">');
            updatedSource = updatedSource.replace(/🔒 관리자 모드 로그인|🔒 관리자 모드 로그인/g, '🔒 관리자 모드 로그인');
            
            updatedSource = updatedSource.replace(regex, `$1${formattedDataJson}$2`);

            navigator.clipboard.writeText(updatedSource).then(() => {
                alert("📋 현재까지 수정된 전체 소스코드가 클립보드에 성공적으로 복사되었습니다!\n\n이 상태에서 기존 메모장이나 index.html 파일을 열어 전체 선택(Ctrl+A) 후 붙여넣기(Ctrl+V) 하시면 영구 저장됩니다.");
            }).catch(err => {
                alert("클립보드 복사 중 오류가 발생했습니다. 브라우저 보안 권한을 확인해주세요.");
            });
        }

        document.getElementById('searchInput').addEventListener('input', applyFilters);
        applyFilters();
    </script>
