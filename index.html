        * {
            box-sizing: border-box;

            background-color: #0b0b0e;

            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;

            padding: 20px;

            flex-direction: column;
            align-items: center;
        }

        /* 📱 반응형 고급 배너 스타일 */
        .banner-container {
            width: 100%;
            max-width: 650px;
            margin-top: 10px;
            margin-bottom: 25px;
            text-align: center;
        }
        
        .banner-img {
            width: 100%;
            display: block;
            border-radius: 22px;
            border: 2px solid #d4af37;
            height: auto;
            box-shadow:
                0 0 20px rgba(255, 215, 0, 0.15),
                0 0 40px rgba(255, 64, 159, 0.08);
        }

        /* 관리자 로그인 상태창 */
        .admin-status-bar {
            width: 100%;
            max-width: 650px;
            text-align: right;
            margin-bottom: 15px;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }
        .admin-link-btn {
            background: none;
            border: none;
            color: #475569;
            cursor: pointer;
            font-size: 12px;
            text-decoration: underline;
        }
        .admin-link-btn:hover { color: #ff409f; }
        
        #changePwBtn { display: none; color: #64748b; }

        /* 검색창 */
        .search-container {
            width: 100%;
            max-width: 650px;
            margin-bottom: 20px;
        }
        .search-input {
            width: 100%;
            padding: 16px 20px;
            background-color: #16161f;
            border: 1px solid #272733;
            border-radius: 14px;
            color: white;
            font-size: 15px;
        }
        .search-input:focus { outline: none; border-color: #ff409f; }

        /* 필터 버튼 영역 */
        .filter-section {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }
        .filter-group { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .filter-btn {
            background-color: #16161f;
            color: #cbd5e1;
            border: none;
            padding: 10px 16px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .filter-btn:hover { transform: translateY(-2px); }

        /* 활성화 스타일 */
        .filter-btn.active[data-type="all"] { background-color: #ffffff; color: #000000; }
        .filter-btn.active[data-type="range"] { background-color: #3b82f6; color: #ffffff; }
        .filter-btn.active[data-type="hot"] { background: linear-gradient(135deg, #ff4d00, #ff007f); color: #ffffff; }
        .filter-btn.active[data-type="new"] { background: linear-gradient(135deg, #00f3ff, #0077ff); color: #ffffff; }
        .filter-btn.active[data-type="star"] { background: linear-gradient(135deg, #ffd700, #ffaa00); color: #000000; }
        .filter-btn.active[data-type="bangsel"] { background: linear-gradient(135deg, #ae4dff, #ff00e4); color: #ffffff; }
        .filter-btn.active[data-type="roulette"] { background: linear-gradient(135deg, #00e575, #8ce800); color: #000000; }
        .filter-btn.active[data-type="etc"] { background: linear-gradient(135deg, #4da6ff, #003fff); color: #ffffff; }

        /* 관리자 편집 패널 */
        .admin-panel {
            width: 100%;
            max-width: 650px;
            background-color: #161624;
            border: 1px solid #ff409f;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 30px;
            display: none;
        }
        .admin-panel h3 { margin-top: 0; color: #ff409f; font-size: 16px; }
        .form-group { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
        .form-input {
            background-color: #0b0b0e;
            border: 1px solid #222232;
            border-radius: 6px;
            color: white;
            padding: 10px;
            font-size: 14px;
        }
        .btn-submit {
            background-color: #ff409f;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-submit:hover { background-color: #d92680; }

        /* 테이블 스타일 */
        .table-container {
            width: 100%;
            max-width: 650px;
            border: 1px solid #1f1f29;
            border-radius: 18px;
            overflow: hidden;
            background-color: #111116;
        }

        th, td { padding: 18px; }
        th { background-color: #16161f; color: #94a3b8; font-size: 14px; }
        td { border-top: 1px solid #1d1d28; font-size: 15px; vertical-align: middle; }
        tr:hover { background: rgba(255,255,255,0.02); }

        /* 관리자 모드에서 숨김 처리된 행의 비주얼 피드백 */
        tr.row-hidden { opacity: 0.4; background-color: rgba(0, 0, 0, 0.3); }

        .title-col { color: #f8fafc; font-weight: 500; }
        .action-col { width: 340px; text-align: right; display: none; }

            background-color: #1c1c27;
            border: 1px solid #ff409f;
            border-radius: 6px;
            color: white;
            padding: 6px 10px;
            font-size: 14px;
            width: 100%;
        }

            display: inline-flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-end;
            justify-content: center;
        }
        .tag-row {
            display: flex;
            gap: 4px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

            background-color: #1c1c27;
            border: 1px solid #2d2d3f;
            color: #94a3b8;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-inline-tag.active-hot { background-color: rgba(255, 80, 80, 0.25); color: #ff5555; border-color: #ff5555; }
        .btn-inline-tag.active-new { background-color: rgba(0, 255, 255, 0.25); color: #00f7ff; border-color: #00f7ff; }
        .btn-inline-tag.active-star { background-color: rgba(255, 215, 0, 0.25); color: gold; border-color: gold; }
        .btn-inline-tag.active-bangsel { background-color: rgba(174, 77, 255, 0.25); color: #d680ff; border-color: #d680ff; }
        .btn-inline-tag.active-roulette { background-color: rgba(0, 229, 117, 0.25); color: #00ff84; border-color: #00ff84; }

        function toggleAdminMode() {
            if (!isAdmin) {
                const inputPw = prompt("관리자 비밀번호를 입력하세요:");
                if (inputPw === null) return;

                const hashedInput = CryptoJS.SHA256(inputPw).toString();
                const targetHash = getSavedPasswordHash();

                if (hashedInput === targetHash) {
                    isAdmin = true;
                    document.getElementById('adminLoginBtn').innerText = "🔓 관리자 로그아웃";

            const newPw = prompt("새로운 비밀번호를 입력하세요:");
            if (newPw === null) return;
            
            const confirmPw = prompt("새로운 비밀번호를 한번 더 입력하세요:");
            if (confirmPw === null) return;

            if (newPw !== confirmPw) {
                alert("입력하신 두 비밀번호가 일치하지 않습니다. 다시 시도해 주세요.");
                return;
            }

            if (newPw.trim() === "") {
                alert("공백 비밀번호는 사용할 수 없습니다.");
                return;
            }

            const newHash = CryptoJS.SHA256(newPw).toString();
            localStorage.setItem('seyeonAdminPwHash', newHash);
            alert("🔒 관리자 비밀번호가 성공적으로 변경되었습니다!");
        }

        function renderTable(data) {
            const tableBody = document.getElementById('sigTableBody');
            tableBody.innerHTML = '';

            if (data.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="' + (isAdmin ? 3 : 2) + '" style="text-align:center; color:#64748b; padding: 50px 0;">검색 결과가 없습니다.</td></tr>';
                return;
            }

            data.forEach(item => {
                const originIndex = sigData.findIndex(origin => origin.num === item.num && origin.title === item.title);
                
                // 일반 사용자 모드일 때 'hidden' 태그가 있으면 렌더링 스킵 (목록에서 숨김)
                if (!isAdmin && item.tags && item.tags.includes('hidden')) {
                    return;
                }

                const tr = document.createElement('tr');
                
                let badgeHtml = '';
                const hasTag = item.tags && item.tags.length > 0;
                
                // 복수 태그 지원 대응용 분류 필터링 (hidden 태그 외의 첫 번째 시각성 태그 파악)
                let currentTag = '';
                if (hasTag) {
                    currentTag = item.tags.find(t => t !== 'hidden') || '';
                }
                const isHidden = item.tags && item.tags.includes('hidden');

                if (isHidden) {
                    tr.classList.add('row-hidden');
                    badgeHtml += '<span class="badge badge-hidden">숨김 목록</span>';
                }

                if (currentTag === 'hot') badgeHtml += '<span class="badge badge-hot">HOT 🔥</span>';
                else if (currentTag === 'new') badgeHtml += '<span class="badge badge-new">NEW ✨</span>';
                else if (currentTag === 'star') badgeHtml += '<span class="badge badge-star">열혈 ⭐</span>';
                else if (currentTag === 'bangsel') badgeHtml += '<span class="badge badge-bangsel">방셀 📸</span>';
                else if (currentTag === 'roulette') badgeHtml += '<span class="badge badge-roulette">룰렛 🎰</span>';
                else if (currentTag === 'etc') badgeHtml += '<span class="badge badge-etc">기타 🎸</span>';

                let numTdContent = item.num.toLocaleString();
                let titleTdContent = `${item.title} ${badgeHtml}`;
                let actionTd = '';

                if (isAdmin) {
                    // 현재 수정 중인 항목 레이아웃 분기
                    if (editingIndex === originIndex) {
                        numTdContent = `<input type="number" id="inlineEditNum" class="inline-edit-input" value="${item.num}" style="width:75px;">`;
                        titleTdContent = `<input type="text" id="inlineEditTitle" class="inline-edit-input" value="${item.title}">`;
                        
                        actionTd = `
                        <td class="action-col" style="display: table-cell; vertical-align: middle;">
                            <div class="inline-tag-editor">
                                <div class="tag-row" style="margin-bottom:4px;">
                                    <button class="btn-inline-util" onclick="saveInlineEdit(${originIndex})" style="background-color:#ff409f; border-color:#ff409f; color:white;">저장</button>
                                    <button class="btn-inline-util" onclick="cancelInlineEdit()">취소</button>
                                </div>
                            </div>
                        </td>`;
                    } else {
                        actionTd = `
                        <td class="action-col" style="display: table-cell;">
                            <div class="inline-tag-editor">
                                <div class="tag-row">
                                    <button class="btn-inline-tag ${!currentTag ? 'active-none' : ''}" onclick="updateTagDirect(${originIndex}, '')">일반</button>
                                    <button class="btn-inline-tag ${currentTag === 'hot' ? 'active-hot' : ''}" onclick="updateTagDirect(${originIndex}, 'hot')">HOT</button>
                                    <button class="btn-inline-tag ${currentTag === 'new' ? 'active-new' : ''}" onclick="updateTagDirect(${originIndex}, 'new')">NEW</button>
                                    <button class="btn-inline-tag ${currentTag === 'star' ? 'active-star' : ''}" onclick="updateTagDirect(${originIndex}, 'star')">열혈</button>
                                </div>
                                <div class="tag-row">
                                    <button class="btn-inline-tag ${currentTag === 'bangsel' ? 'active-bangsel' : ''}" onclick="updateTagDirect(${originIndex}, 'bangsel')">방셀</button>
                                    <button class="btn-inline-tag ${currentTag === 'roulette' ? 'active-roulette' : ''}" onclick="updateTagDirect(${originIndex}, 'roulette')">룰렛</button>
                                    <button class="btn-inline-tag ${currentTag === 'etc' ? 'active-etc' : ''}" onclick="updateTagDirect(${originIndex}, 'etc')">기타</button>
                                    <button class="btn-inline-util" onclick="startInlineEdit(${originIndex})">수정</button>
                                    <button class="btn-inline-util btn-inline-hide ${isHidden ? 'active-hidden' : ''}" onclick="toggleHideItem(${originIndex})">${isHidden ? '해제' : '숨김'}</button>
                                    <button class="btn-inline-util btn-inline-del" onclick="deleteSigItem(${originIndex})">삭제</button>
                                </div>
                            </div>
                        </td>`;
                    }
                }

                tr.innerHTML = `
                    <td class="num-col" style="vertical-align: middle;">${numTdContent}</td>
                    <td class="title-col" style="vertical-align: middle;">${titleTdContent}</td>
                    ${actionTd}
                `;
                tableBody.appendChild(tr);
            });
        }

        // 원클릭 다이렉트 태그 변경 시스템 (기존 hidden 유무 판별 보존)
        function updateTagDirect(index, newTag) {
            const isHidden = sigData[index].tags ? sigData[index].tags.includes('hidden') : false;
            let nextTags = [];
            
            if (newTag !== '') {
                nextTags.push(newTag);
            }
            if (isHidden) {
                nextTags.push('hidden');
            }
            
            sigData[index].tags = nextTags;
            saveAndRefresh();
        }

        // 인라인 수정 모드 제어 엔진
        function startInlineEdit(index) {
            editingIndex = index;
            applyFilters();
        }

        function cancelInlineEdit() {
            editingIndex = null;
            applyFilters();
        }

        function saveInlineEdit(index) {
            const editNum = parseInt(document.getElementById('inlineEditNum').value);
            const editTitle = document.getElementById('inlineEditTitle').value.trim();

            if (!editNum || !editTitle) {
                alert("개수(번호)와 내용을 모두 올바르게 입력해야 수정이 완료됩니다.");
                return;
            }

            sigData[index].num = editNum;
            sigData[index].title = editTitle;
            
            editingIndex = null;
            saveAndRefresh();
        }

        // 항목 숨김 토글 제어 엔진
        function toggleHideItem(index) {
            if (!sigData[index].tags) {
                sigData[index].tags = [];
            }
            
            const findIdx = sigData[index].tags.indexOf('hidden');
            if (findIdx > -1) {
                sigData[index].tags.splice(findIdx, 1); // 숨김 해제
            } else {
                sigData[index].tags.push('hidden'); // 숨김 추가
            }
            
            saveAndRefresh();
        }

        function addSigItem() {
            const numVal = parseInt(document.getElementById('formNum').value);
            const titleVal = document.getElementById('formTitle').value.trim();
            const tagVal = document.getElementById('formTag').value;

            if (!numVal || !titleVal) {
                alert("개수(번호)와 내용을 정확하게 입력해주세요.");
                return;
            }

            const itemData = { num: numVal, title: titleVal, tags: tagVal ? [tagVal] : [] };
            sigData.push(itemData);

            saveAndRefresh();
            resetForm();
        }

        function deleteSigItem(index) {
            if (confirm(`'${sigData[index].title}' 항목을 목록에서 삭제하시겠습니까?`)) {
                sigData.splice(index, 1);
                if (editingIndex === index) editingIndex = null;
                saveAndRefresh();
            }
        }

        function resetForm() {
            document.getElementById('formNum').value = "";
            document.getElementById('formTitle').value = "";
            document.getElementById('formTag').value = "";
        }

        function saveAndRefresh() {
            localStorage.setItem('seyeonSigData', JSON.stringify(sigData));
            applyFilters();
        }

        function filterData(type, value, buttonElement) {
            filterType = type;
            filterValue = value;
            
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');

            document.getElementById('searchInput').value = '';
            applyFilters();
        }

        function applyFilters() {
            const searchText = document.getElementById('searchInput').value.trim().toLowerCase();
            let filtered = [...sigData];

            // 1. 태그 및 조건 필터링 단계
            if (filterType === 'tag') {
                filtered = filtered.filter(item => item.tags.includes(filterValue));
            } else if (filterType === 'range') {
                // 범위 검색 필터에서도 '기타(etc)' 항목은 기본적으로 제외
                filtered = filtered.filter(item => item.num >= filterValue[0] && item.num <= filterValue[1] && !item.tags.includes('etc'));
            } else if (filterType === 'all') {
                // [수정] '전체' 상태일 때는 '기타(etc)' 태그가 없는 항목만 추출
                filtered = filtered.filter(item => !item.tags.includes('etc'));
            }

            // 2. 통합 검색어 필터링 단계
            if (searchText) {
                // 현재 선택된 버튼이 '기타 🎸' 탭이 아니라면, 검색 결과에서도 '기타' 항목은 무조건 검색에서 노출되지 않도록 필터 추가
                if (filterType !== 'tag' || filterValue !== 'etc') {
                    filtered = filtered.filter(item => !item.tags.includes('etc'));
                }
                
                filtered = filtered.filter(item => 
                    item.num.toString().includes(searchText) || 
                    item.title.toLowerCase().includes(searchText)
                );
            }

            // 3. 정렬 및 테이블 출력
            filtered.sort((a, b) => a.num - b.num);
            renderTable(filtered);
            
            document.getElementById('thAction').style.display = isAdmin ? "table-cell" : "none";
        }

        document.getElementById('searchInput').addEventListener('input', applyFilters);
        applyFilters();
    </script>
</body>
</html>
